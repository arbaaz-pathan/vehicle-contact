<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vehicle Contact | MH 02 DZ 5236</title>

    <meta name="description" content="Vehicle owner contact page for MH 02 DZ 5236">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Arial, sans-serif;

            min-height: 100vh;

            background:
                linear-gradient(135deg, #111827, #1f2937, #374151);

            color: #ffffff;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;
        }

        .card {
            background: rgba(255, 255, 255, 0.08);

            border: 1px solid rgba(255, 255, 255, 0.15);

            border-radius: 28px;

            padding: 32px 24px;

            text-align: center;

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.35);
        }

        .car-icon {
            width: 82px;
            height: 82px;

            margin: 0 auto 18px;

            border-radius: 50%;

            background: linear-gradient(
                135deg,
                #f8fafc,
                #d1d5db
            );

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 38px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.25);
        }

        h1 {
            font-size: 28px;
            font-weight: 700;

            margin-bottom: 7px;
        }

        .subtitle {
            color: #d1d5db;

            font-size: 15px;

            margin-bottom: 26px;
        }

        .vehicle-number {
            display: inline-block;

            background: #f8fafc;

            color: #111827;

            padding: 11px 19px;

            border-radius: 10px;

            font-size: 19px;

            font-weight: 800;

            letter-spacing: 2px;

            margin-bottom: 28px;

            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .info {
            text-align: left;

            margin-bottom: 26px;
        }

        .info-row {
            display: flex;

            align-items: center;

            gap: 14px;

            padding: 16px;

            margin-bottom: 12px;

            background: rgba(255, 255, 255, 0.07);

            border-radius: 15px;

            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .icon {
            width: 44px;
            height: 44px;

            border-radius: 12px;

            background: rgba(255, 255, 255, 0.12);

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 21px;

            flex-shrink: 0;
        }

        .label {
            font-size: 12px;

            color: #9ca3af;

            margin-bottom: 4px;

            letter-spacing: 0.5px;
        }

        .value {
            font-size: 16px;

            font-weight: 600;

            color: #ffffff;
        }

        .buttons {
            display: flex;

            flex-direction: column;

            gap: 12px;
        }

        .button {
            display: block;

            width: 100%;

            padding: 16px;

            border-radius: 14px;

            text-decoration: none;

            font-size: 16px;

            font-weight: 700;

            transition:
                transform 0.2s ease,
                opacity 0.2s ease;
        }

        .button:hover {
            transform: translateY(-2px);

            opacity: 0.92;
        }

        .call-button {
            background: #ffffff;

            color: #111827;

            box-shadow:
                0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .footer {
            margin-top: 24px;

            color: #9ca3af;

            font-size: 12px;

            line-height: 1.5;
        }

        @media (max-width: 380px) {

            .card {
                padding: 26px 18px;
            }

            h1 {
                font-size: 24px;
            }

            .vehicle-number {
                font-size: 17px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="card">

            <div class="car-icon">
                🚗
            </div>

            <h1>Vehicle Contact</h1>

            <p class="subtitle">
                Need to contact the vehicle owner?
            </p>

            <div class="vehicle-number">
                MH 02 DZ 5236
            </div>

            <div class="info">

                <div class="info-row">

                    <div class="icon">
                        👤
                    </div>

                    <div>
                        <div class="label">
                            OWNER
                        </div>

                        <div class="value">
                            Arbaaz Pathan
                        </div>
                    </div>

                </div>

                <div class="info-row">

                    <div class="icon">
                        🚘
                    </div>

                    <div>
                        <div class="label">
                            VEHICLE
                        </div>

                        <div class="value">
                            Maruti Suzuki Ciaz
                        </div>
                    </div>

                </div>

            </div>

            <div class="buttons">

                <a
                    class="button call-button"
                    href="tel:+917666893366">

                    📞 Call Vehicle Owner

                </a>

            </div>

            <div class="footer">

                Please contact the owner only when necessary.

                <br>

                Thank you.

            </div>

        </div>

    </div>

</body>
</html>
